name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Get the code
        run: |
          git init --quiet .
          git fetch --quiet --depth=1 \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "${{ github.sha }}"
          git checkout --quiet FETCH_HEAD
      - name: Check the rules that a script can check
        if: matrix.os == 'ubuntu-latest'
        env:
          TEMPLATE: ${{ github.event.repository.is_template }}
        run: bash .github/scripts/check-rules.sh
      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Run the tests
        if: always()
        env:
          TEST_COMMAND: 'cargo test'
        run: |
          if [ -z "$TEST_COMMAND" ]; then
            echo "::warning::No tests run yet: set TEST_COMMAND in .github/workflows/checks.yml."
            exit 0
          fi
          bash -c "$TEST_COMMAND"
